<svg xmlns="http://www.w3.org/2000/svg" width="740" height="290" viewBox="0 0 740 290" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t1" markerWidth="7" markerHeight="7" refX="6.2" refY="3.2" orient="auto">
      <path d="M0,0.4 L6.4,3.2 L0,6 z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect width="740" height="290" fill="#FFFFFF"/>

  <!-- host boundary -->
  <rect x="10" y="10" width="720" height="270" fill="#FCFCFC" stroke="#C4C4C4" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="22" y="28" font-size="11" fill="#8A8A8A">one host, container network</text>

  <!-- management node -->
  <rect x="26" y="95" width="150" height="120" fill="#F4F4F4" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="101" y="116" font-size="12" font-weight="bold" text-anchor="middle" fill="#1A1A1A">management node</text>
  <rect x="38" y="124" width="126" height="24" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1"/>
  <text x="101" y="140" font-size="10.5" text-anchor="middle" fill="#4A4A4A">EGO manager</text>
  <rect x="38" y="152" width="126" height="24" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1"/>
  <text x="101" y="168" font-size="10.5" text-anchor="middle" fill="#4A4A4A">session manager</text>
  <rect x="38" y="180" width="126" height="24" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1"/>
  <text x="101" y="196" font-size="10.5" text-anchor="middle" fill="#4A4A4A">client</text>

  <!-- fan-out arrows -->
  <line x1="180" y1="125" x2="222" y2="76"  stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#t1)"/>
  <line x1="180" y1="155" x2="222" y2="145" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#t1)"/>
  <line x1="180" y1="185" x2="222" y2="234" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#t1)"/>

  <!-- compute node 1 -->
  <rect x="226" y="44" width="300" height="58" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <text x="240" y="64" font-size="11.5" font-weight="bold" fill="#1A1A1A">compute node 1</text>
  <rect x="240" y="72" width="118" height="22" fill="#F4F4F4" stroke="#9A9A9A" stroke-width="1"/>
  <text x="299" y="87" font-size="10" text-anchor="middle" fill="#4A4A4A">service instance</text>
  <rect x="366" y="72" width="146" height="22" fill="#FDF3EA" stroke="#E8761E" stroke-width="1.1"/>
  <text x="439" y="87" font-size="10" text-anchor="middle" fill="#C2600F">worker + mapped model</text>

  <!-- compute node 2 -->
  <rect x="226" y="116" width="300" height="58" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <text x="240" y="136" font-size="11.5" font-weight="bold" fill="#1A1A1A">compute node 2</text>
  <rect x="240" y="144" width="118" height="22" fill="#F4F4F4" stroke="#9A9A9A" stroke-width="1"/>
  <text x="299" y="159" font-size="10" text-anchor="middle" fill="#4A4A4A">service instance</text>
  <rect x="366" y="144" width="146" height="22" fill="#FDF3EA" stroke="#E8761E" stroke-width="1.1"/>
  <text x="439" y="159" font-size="10" text-anchor="middle" fill="#C2600F">worker + mapped model</text>

  <text x="376" y="196" font-size="14" text-anchor="middle" fill="#9A9A9A">&#8226; &#8226; &#8226;</text>

  <!-- compute node n -->
  <rect x="226" y="208" width="300" height="58" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <text x="240" y="228" font-size="11.5" font-weight="bold" fill="#1A1A1A">compute node n</text>
  <rect x="240" y="236" width="118" height="22" fill="#F4F4F4" stroke="#9A9A9A" stroke-width="1"/>
  <text x="299" y="251" font-size="10" text-anchor="middle" fill="#4A4A4A">service instance</text>
  <rect x="366" y="236" width="146" height="22" fill="#FDF3EA" stroke="#E8761E" stroke-width="1.1"/>
  <text x="439" y="251" font-size="10" text-anchor="middle" fill="#C2600F">worker + mapped model</text>

  <!-- PCIe to devices -->
  <g stroke="#1A1A1A" stroke-width="1.3">
    <line x1="530" y1="83"  x2="588" y2="83"  marker-end="url(#t1)"/>
    <line x1="530" y1="155" x2="588" y2="155" marker-end="url(#t1)"/>
    <line x1="530" y1="247" x2="588" y2="247" marker-end="url(#t1)"/>
  </g>
  <text x="559" y="75"  font-size="9.5" text-anchor="middle" fill="#7A7A7A">PCIe</text>
  <text x="559" y="147" font-size="9.5" text-anchor="middle" fill="#7A7A7A">PCIe</text>
  <text x="559" y="239" font-size="9.5" text-anchor="middle" fill="#7A7A7A">PCIe</text>

  <g fill="#FDF3EA" stroke="#E8761E" stroke-width="1.5">
    <rect x="592" y="66"  width="120" height="34"/>
    <rect x="592" y="138" width="120" height="34"/>
    <rect x="592" y="230" width="120" height="34"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle" fill="#C2600F">
    <text x="652" y="88">AKD1500</text>
    <text x="652" y="160">AKD1500</text>
    <text x="652" y="252">AKD1500</text>
  </g>
</svg>
